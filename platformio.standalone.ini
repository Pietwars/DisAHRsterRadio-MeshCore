; LILYGO T-Deck Plus Standalone (Issue #35): Build ohne WLAN und ohne Weboberfläche, bedient am Gerät.
; MeshCore-Companion über PIN-Bluetooth wie im normalen DAR-MC-Build (dar_LilyGo_TDeck_wifi).
; Standalone: MeshCore-Protokoll mit separater DE-Sendebegrenzung. Anzeige: Start (Logo, Akkuzeile, Kacheln), Chat, Meldung, Brett, Karte,
; Standort, Gerät über Tastatur und Trackball (ui-brand/StandaloneUI, StandaloneFrontend.cpp); docs/STANDALONE.md.
; Die Web-Schicht ist nicht abgeschaltet, sondern fehlt: WebFrontend.cpp (WLAN-Zugangspunkt + DisasterPortal)
; wird per build_src_filter entfernt, die WLAN-/Webserver-Bibliotheken per lib_ignore. Bindet doch etwas
; WiFi.h/WebServer.h ein, bricht der Build ab. tools/check_standalone.py prüft zusätzlich die gelinkte Firmware.
; Testbuild: nicht im Release, nicht im Web-Flasher, nicht in tools/devices.json / tools/release_boards.json.
; Gleiche Partitionstabelle wie der normale T-Deck-Build (huge_app.csv): Kontakte/Einstellungen im SPIFFS bleiben
; beim Wechsel erhalten; die Webdateien im SPIFFS werden nicht mehr benutzt.
[env:LilyGo_TDeck_standalone]
extends = env:LilyGo_TDeck_companion_radio_ble
lib_ldf_mode = deep+
board_build.partitions = huge_app.csv
board_build.embed_files = examples/companion_radio/ui-brand/assets/tdeck-splash.rgb565
build_flags =
  ${env:LilyGo_TDeck_companion_radio_ble.build_flags}
  -D LORA_TX_POWER=22
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=64
  -D DISASTER_STANDALONE=1
  -D DISASTER_SD=1          ; SD-Karte: Einstellungen, Ereignis-Log, Verlaufsarchiv (keine PINs/Schlüssel)
  -D PIN_SD_CS=39           ; SD am gemeinsamen SPI-Bus (SCK 40/MISO 38/MOSI 41); CS laut LilyGO-Belegung, auf Hardware prüfen
  -D PIN_TB_UP=3            ; Trackball-Richtungen (Hall-Sensoren), Klick = GPIO 0 (PIN_USER_BTN)
  -D PIN_TB_DOWN=15
  -D PIN_TB_LEFT=1
  -D PIN_TB_RIGHT=2
  -D FIRMWARE_VERSION='"v1.18.0-dar0.9.6-standalone-test6"'
build_src_filter = ${env:LilyGo_TDeck_companion_radio_ble.build_src_filter}
  -<../examples/companion_radio/WebFrontend.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>   ; ESP-NOW läuft über das WLAN-Funkteil
lib_ignore =
  WiFi
  WiFiClientSecure
  WebServer
  DNSServer
  ESPmDNS
  HTTPClient
  HTTPUpdate
  AsyncTCP
  ESPAsyncWebServer
  ESP Async WebServer
  AsyncElegantOTA
lib_deps =
  ${env:LilyGo_TDeck_companion_radio_ble.lib_deps}
