name: Release
# Baut bei jedem Versions-Tag v* die Release-Geräte LILYGO T-Deck Plus und LILYGO T-Watch S3
# (tools/build_device.sh LilyGo_TDeck / LilyGo_TWatchS3), prüft jedes Paket (Vollständigkeit, Prüfsummen, Version) und
# veröffentlicht das GitHub-Release „DisAHRsterRadio-MeshCore v<Version>“. Übrige Boards bleiben im Code, sind aber nicht im Release.
# Gibt es das Release zum Tag schon (z. B. mit den auf Hardware getesteten Paketen), wird nichts hochgeladen oder ersetzt;
# die CI-Pakete bleiben dann nur als Workflow-Artefakte zum Vergleich.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
  pull_request:
    # Probelauf (beide Geräte, ohne Veröffentlichung), wenn sich Paketierung oder dieser Workflow ändern
    paths: ['tools/build_device.sh', 'tools/write_liesmich.py', 'tools/verify_release.py', 'tools/verify_devices.py', 'tools/release_notes.py', 'tools/ANLEITUNG.template.md', 'tools/validate_memory.py', 'tools/release_boards.json', 'tests/test_memory_validation.py', 'platformio*.ini', 'boards/**', 'variants/**/platformio.ini', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v0.9.1-alpha'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.m.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag passt zur Datei VERSION
        run: |
          python3 tools/version.py --check
          V=$(python3 tools/version.py --get)
          [ -z "$TAG" ] || [ "$TAG" = "v$V" ] || { echo "Tag $TAG passt nicht zu VERSION=$V"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Host regression and packaging gates
        run: |
          python3 tools/run_096_host_tests.py
          python3 -m unittest discover -s tests -p 'test_memory_validation.py' -v
          python3 -m unittest discover -s tests -p 'test_candidate_package.py' -v
      - id: m
        run: |
          echo 'devices=["LilyGo_TDeck","LilyGo_TWatchS3"]' >> "$GITHUB_OUTPUT"
  devices:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        device: ${{ fromJson(needs.check.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0 esptool==5.6.0 pillow==11.3.0
      - name: Weboberfläche eingebettet und aktuell
        run: python tools/embed_web.py && git diff --exit-code -- examples/companion_radio/PortalPage.h examples/companion_radio/PortalAssets.h
      - name: Bauen und packen
        run: tools/build_device.sh "${{ matrix.device }}" dist/devices
      - name: Speicherbericht
        run: cat dist/devices/*/memory-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.device }}
          path: dist/devices/*.zip
          if-no-files-found: error
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-release-standalone-${{ hashFiles('platformio*.ini', 'variants/**/platformio.ini') }}
      - run: pip install platformio==6.2.0 pillow==11.3.0
      - name: Standalone bauen und pruefen
        shell: bash
        run: |
          set -o pipefail
          pio run -e LilyGo_TDeck_standalone | tee .pio-LilyGo_TDeck_standalone.log
          python3 tools/check_standalone.py --build-dir .pio/build/LilyGo_TDeck_standalone --build-log .pio-LilyGo_TDeck_standalone.log --output .pio/build/LilyGo_TDeck_standalone/standalone-report
          python3 tools/standalone_preview.py .pio/build/LilyGo_TDeck_standalone/touch-preview
          BOOTAPP0=$(find "$HOME/.platformio/packages/" -path '*framework-arduinoespressif32*' -name boot_app0.bin | head -1)
          python3 tools/prepare_standalone_candidate.py --release --build-dir .pio/build/LilyGo_TDeck_standalone --build-log .pio-LilyGo_TDeck_standalone.log --boot-app0 "$BOOTAPP0" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dev-LilyGo_TDeck_standalone
          path: dist/*.zip
          if-no-files-found: error
  previews:
    runs-on: ubuntu-latest
    env:
      DAR_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Use preinstalled runner Chrome (no additional browser download)
        run: google-chrome --version
      - name: Private chat browser regression and current demo previews
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web > /tmp/preview-server.log 2>&1 &
          node tools/web_previews.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-web-previews
          path: web-previews/*.jpg
          if-no-files-found: error
  release:
    needs: [check, devices, standalone, previews]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pakete prüfen (Vollständigkeit, Prüfsummen, Version)
        run: |
          V=$(python3 tools/version.py --get)
          python3 tools/verify_devices.py dist "$V" LilyGo_TDeck LilyGo_TWatchS3
          python3 tools/prepare_standalone_candidate.py --release --check dist/DisAHRsterRadio-MeshCore-$V-LilyGo_TDeck_standalone-test6.zip
          (cd dist && sha256sum *.zip > SHA256SUMS-DisAHRsterRadio-MeshCore-$V.txt)
          ls dist | wc -l
      - name: Release-Text erzeugen
        run: |
          python3 tools/release_notes.py "$(python3 tools/version.py --get)" "${{ github.repository }}" DisAHRsterRadio-MeshCore \
            "LilyGo_TDeck=LILYGO T-Deck Plus" "LilyGo_TWatchS3=LILYGO T-Watch S3" | tee notes.md
      - name: Release veröffentlichen
        if: env.TAG != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAG" ]; then TAG="v$(python3 tools/version.py --get)"; fi
          ASSETS="dist/*.zip dist/SHA256SUMS-*.txt dist/*.jpg"
          for f in docs/flyer/*-Flyer.pdf docs/flyer/*-Flyer-digital.pdf docs/flyer/*-Flyer-vorschau.jpg; do [ -f "$f" ] && ASSETS="$ASSETS $f"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits (hardware-getestete Pakete) – keine Uploads, nichts ersetzt."
            (cd dist && sha256sum *.zip)
          else
            PRE=""; case "$TAG" in *-*) PRE=--prerelease;; esac
            gh release create "$TAG" $PRE --target "$GITHUB_SHA" --title "DisAHRsterRadio-MeshCore $TAG" --notes-file notes.md $ASSETS
          fi
          gh release view "$TAG" --json assets --jq '.assets | length'
