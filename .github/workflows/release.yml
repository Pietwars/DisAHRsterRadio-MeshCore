name: Release
# Baut bei jedem Versions-Tag v* die Release-Boards: Heltec V2 (tools/package.sh) und LILYGO T-Deck Plus
# (tools/build_device.sh LilyGo_TDeck), prüft jedes Paket (Vollständigkeit, Prüfsummen, Version) und veröffentlicht
# ein GitHub-Release. Übrige Boards bleiben im Code, sind aber vorerst nicht im Release.
# Gibt es das Release zum Tag schon (z. B. mit den auf Hardware getesteten Paketen), wird nichts hochgeladen oder ersetzt;
# die CI-Pakete bleiben dann nur als Workflow-Artefakte zum Vergleich.
on:
  push:
    tags: ['v*']
  pull_request:
    # Probelauf (nur Haupt-Boards, ohne Veröffentlichung), wenn sich Paketierung oder dieser Workflow ändern
    paths: ['tools/package.sh', 'tools/verify_release.py', 'tools/verify_devices.py', 'tools/release_notes.py', 'tools/ANLEITUNG.template.md', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v0.9.1-alpha'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.m.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag passt zur Datei VERSION
        run: |
          python3 tools/version.py --check
          V=$(python3 tools/version.py --get)
          [ -z "$TAG" ] || [ "$TAG" = "v$V" ] || { echo "Tag $TAG passt nicht zu VERSION=$V"; exit 1; }
      - id: m
        run: |
          if [ -n "$TAG" ]; then
            echo 'devices=["LilyGo_TDeck"]' >> "$GITHUB_OUTPUT"
          else
            echo 'devices=[]' >> "$GITHUB_OUTPUT"
          fi
  boards:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env: [disaster_heltec_v2_sx1276_wifi]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0 esptool==5.6.0
      - name: Weboberfläche eingebettet und aktuell
        run: python tools/embed_web.py && git diff --exit-code -- examples/companion_radio/PortalPage.h examples/companion_radio/PortalAssets.h
      - name: Bauen und packen
        run: ENVS="${{ matrix.env }}" tools/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.env }}
          path: dist/*.zip
          if-no-files-found: error
  devices:
    needs: check
    if: needs.check.outputs.devices != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        device: ${{ fromJson(needs.check.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0 esptool==5.6.0
      - name: Bauen und packen
        run: tools/build_device.sh "${{ matrix.device }}" dist/devices
      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.device }}
          path: dist/devices/*.zip
          if-no-files-found: error
  release:
    needs: [check, boards, devices]
    if: always() && needs.check.result == 'success' && needs.boards.result == 'success' && (needs.devices.result == 'success' || (needs.devices.result == 'skipped' && needs.check.outputs.devices == '[]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pakete prüfen (Vollständigkeit, Prüfsummen, Version)
        run: |
          V=$(python3 tools/version.py --get)
          python3 tools/verify_release.py dist DisAHRsterRadio-MeshCore "$V" spiffs.bin heltec-v2
          if [ -n "$TAG" ]; then python3 tools/verify_devices.py dist "$V" LilyGo_TDeck; fi
          (cd dist && sha256sum *.zip > SHA256SUMS-DisAHRsterRadio-MeshCore-$V.txt)
          ls dist | wc -l
      - name: Release-Text erzeugen
        run: |
          python3 tools/release_notes.py "$(python3 tools/version.py --get)" "${{ github.repository }}" DisAHRsterRadio-MeshCore \
            "heltec-v2=Heltec WiFi LoRa 32 V2 (SX1276)" | tee notes.md
          echo "" >> notes.md
          echo "Zusätzlich das Paket für den LILYGO T-Deck / T-Deck Plus (\`DisAHRsterRadio-MeshCore-<Version>-LilyGo_TDeck.zip\`)." >> notes.md
      - name: Release veröffentlichen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/*.zip dist/SHA256SUMS-*.txt"
          for f in docs/flyer/*-Flyer.pdf docs/flyer/*-Flyer-digital.pdf docs/flyer/*-Flyer-vorschau.jpg; do [ -f "$f" ] && ASSETS="$ASSETS $f"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits (hardware-getestete Pakete) – keine Uploads, nichts ersetzt."
            (cd dist && sha256sum *.zip)
          else
            PRE=""; case "$TAG" in *-*) PRE=--prerelease;; esac
            gh release create "$TAG" $PRE --verify-tag --title "DisAHRsterRadio-MeshCore $TAG" --notes-file notes.md $ASSETS
          fi
          gh release view "$TAG" --json assets --jq '.assets | length'
