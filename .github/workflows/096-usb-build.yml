name: 0.9.6 T-Deck Local Companion Build Check
on:
  push:
    branches:
      - dev/096-security-duty-sos
    paths:
      - '.github/workflows/096-usb-build.yml'
      - 'platformio.devices.ini'
      - 'platformio.standalone.ini'
      - 'variants/**'
      - 'examples/companion_radio/**'
      - 'examples/simple_room_server/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'test/**'
      - 'web/**'
      - 'platformio*.ini'
      - 'lib/**'
      - 'include/**'
      - 'arch/**'
      - 'boards/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usb-096-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tdeck-usb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dar_LilyGo_TDeck_wifi, LilyGo_TDeck_standalone, dar_LilyGo_TWatchS3_wifi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Assert local Companion ownership in selected target
        shell: bash
        run: |
          python - <<'PY'
          import configparser
          import os
          target = os.environ["TARGET"]
          file = "platformio.standalone.ini" if target == "LilyGo_TDeck_standalone" else "platformio.devices.ini"
          config = configparser.ConfigParser(interpolation=None, strict=False)
          config.read(["platformio.devices.ini", "platformio.local.ini", "platformio.standalone.ini"])
          flags = config[f"env:{target}"]["build_flags"]
          assert "-D ENABLE_USB_INTERFACE" not in flags.splitlines(), f"USB conflicts with LocalCompanion in {target}"
          print(f"{target}: no conflicting USB interface flag")
          PY
        env:
          TARGET: ${{ matrix.environment }}
      - name: Check LocalCompanion ownership and Bluetooth inheritance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import configparser
          board = configparser.ConfigParser(interpolation=None)
          board.read("variants/lilygo_tdeck/platformio.ini")
          ble_flags = board["env:LilyGo_TDeck_companion_radio_ble"]["build_flags"]
          assert "-D BLE_PIN_CODE=123456" in ble_flags.splitlines(), "Expected BLE build inheritance changed; review security"
          main = Path("examples/companion_radio/main.cpp").read_text()
          assert "#if defined(ENABLE_USB_INTERFACE)" in main
          assert "interface_manager.addInterface(InterfaceType::USB, &usb_serial_interface);" in main
          assert "interface_manager.addInterface(InterfaceType::Bluetooth, &bluetooth_interface);" in main
          print("USB and BLE registration code paths exist; USB disabled in local-client targets")
          PY
      - name: Run 0.9.6 security regression checks
        run: python tools/check_096_static.py
      - name: Run host regression suite
        run: python tools/run_096_host_tests.py
      - name: Compile firmware (no flashing, no release)
        run: pio run -e ${{ matrix.environment }}
      - name: Collect test firmware binaries
        if: success()
        shell: bash
        env:
          TARGET: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          build_dir=".pio/build/$TARGET"
          test -s "$build_dir/firmware.bin"
          mkdir -p "firmware-test/$TARGET"
          cp "$build_dir/firmware.bin" "firmware-test/$TARGET/firmware.bin"
          for file in bootloader.bin partitions.bin boot_app0.bin; do
            if [ -s "$build_dir/$file" ]; then
              cp "$build_dir/$file" "firmware-test/$TARGET/$file"
            fi
          done
          printf 'DisAHRsterRadio 0.9.6 TEST ONLY\nTarget: %s\nCommit: %s\nNot hardware-tested; no release.\n' "$TARGET" "$GITHUB_SHA" > "firmware-test/$TARGET/README.txt"
          (cd "firmware-test/$TARGET" && sha256sum *.bin > SHA256SUMS)
      - name: Upload test firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DisAHRsterRadio-096-TEST-${{ matrix.environment }}
          path: firmware-test/${{ matrix.environment }}/
          if-no-files-found: error
          retention-days: 14

  room-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build existing DISASTER_ROOM SX1262 target (no flashing)
        run: pio run -e disaster_t3s3_sx1262_room

  web-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Web-Flasher Browser-Prüfung ohne Gerät
        run: node tests/flasher_browser.test.cjs
      - name: Aktuelle Demo-Vorschauen rendern
        run: |
          python3 -m http.server 8765 --directory web > /tmp/preview-server.log 2>&1 &
          node tools/web_previews.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-previews-0.9.6
          path: web-previews/*.jpg
          if-no-files-found: error
