name: DisAHRsterRadio-Build
on:
  push:
    # Nur main und Versions-Tags; PR-Branches laufen über pull_request (keine Doppelläufe push + pull_request)
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  web-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/web_regression.cjs
      - name: Versionsprüfung (VERSION ist die einzige Quelle)
        run: python3 tools/version.py --check && python3 tests/version.test.py
      - name: Bibliotheksversionen fest (keine ^/~-Bereiche)
        run: python3 tools/pin_libs.py --check
      - name: Kartenprüfung
        run: python3 tests/maps.test.py && python3 tests/portal_routes.test.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.9.1: nur die auf Hardware getesteten Boards (T-Deck Plus, Heltec V2); übrige Profile bleiben im Code
        env: [dar_LilyGo_TDeck_wifi, disaster_heltec_v2_sx1276_wifi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-mc-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'platformio.local.ini', 'variants/**/platformio.ini') }}
      - run: pip install platformio==6.2.0 esptool==5.6.0
      - name: Weboberfläche einbetten (Prüfung)
        run: python tools/embed_web.py && git diff --exit-code -- examples/companion_radio/PortalPage.h examples/companion_radio/PortalAssets.h
      - name: Firmware bauen
        run: pio run -e ${{ matrix.env }}
      - name: Dateisystem bauen
        run: pio run -e ${{ matrix.env }} -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/spiffs.bin
