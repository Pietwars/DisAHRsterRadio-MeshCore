name: DisAHRsterRadio-Build
on:
  push:
    # Nur main und Versions-Tags; PR-Branches laufen über pull_request (keine Doppelläufe push + pull_request)
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  web-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/web_regression.cjs
      - run: node tests/offline_shell.test.cjs
      - name: Web-Flasher – Browser-Prüfsummen und negative Updatefälle
        run: node tests/flasher_integrity.test.mjs
      - name: Web-Flasher-Konfiguration (T-Deck Plus + T-Watch S3, Update + Neuinstallation)
        run: python3 tools/flasher_fetch.py --check
      - name: Versionsprüfung (VERSION ist die einzige Quelle)
        run: python3 tools/version.py --check && python3 tests/version.test.py
      - name: Bibliotheksversionen fest (keine ^/~-Bereiche)
        run: python3 tools/pin_libs.py --check
      - name: Kartenprüfung
        run: python3 tests/maps.test.py && python3 tests/portal_routes.test.py
      - name: T-Deck-Standalone-Daten passen zur Weboberfläche (Schnellmeldungen/Orte, Gerätekarten)
        run: python3 tools/gen_quick_messages.py --check && python3 tools/gen_device_map.py --check
      - name: Flash- und Speicherpruefungen (Hosttests)
        run: python3 -m unittest discover -s tests -p 'test_memory_validation.py' -v
      - name: Abnahmepaket (Factory-Offsets, Pruefsummen, keine vorgetaeuschte Freigabe)
        run: python3 -m unittest discover -s tests -p 'test_candidate_package.py' -v
      - name: Aktuelle Standalone-Galerie fuer 0.9.6
        run: python3 tools/check_standalone_previews.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Reguläre WLAN/BLE-Release-Geräte, jeweils mit unabhängig geprüftem Flashvertrag.
        env: [dar_LilyGo_TDeck_wifi, dar_LilyGo_TWatchS3_wifi, disaster_t3s3_sx1262_wifi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-mc-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'platformio.local.ini', 'variants/**/platformio.ini') }}
      - run: pip install platformio==6.2.0 esptool==5.6.0
      - name: Weboberfläche einbetten (Prüfung)
        run: python tools/embed_web.py && git diff --exit-code -- examples/companion_radio/PortalPage.h examples/companion_radio/PortalAssets.h
      - name: Firmware bauen
        shell: bash
        run: pio run -e ${{ matrix.env }} | tee .pio-${{ matrix.env }}.log
      - name: Dateisystem bauen
        run: pio run -e ${{ matrix.env }} -t buildfs
      - name: Flash/Header/Partitionen/Firmware und RAM pruefen
        run: >-
          python3 tools/validate_memory.py --env ${{ matrix.env }}
          --build-dir .pio/build/${{ matrix.env }} --build-log .pio-${{ matrix.env }}.log
          --output .pio/build/${{ matrix.env }}/memory-report
      - name: Speicherbericht
        run: cat .pio/build/${{ matrix.env }}/memory-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/spiffs.bin
            .pio/build/${{ matrix.env }}/memory-report.json
            .pio/build/${{ matrix.env }}/memory-report.md
            .pio-${{ matrix.env }}.log
  standalone:
    # Issue #35: LILYGO T-Deck Plus Standalone ohne WLAN/Web (platformio.standalone.ini). Nur Testbuild:
    # nicht in release.yml, nicht im Web-Flasher, nicht in tools/devices.json; bei Versions-Tags übersprungen.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-mc-LilyGo_TDeck_standalone-${{ hashFiles('platformio.ini', 'platformio.local.ini', 'platformio.standalone.ini', 'variants/**/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Firmware bauen (ohne WLAN/Web)
        shell: bash
        run: pio run -e LilyGo_TDeck_standalone | tee .pio-LilyGo_TDeck_standalone.log
      - name: Keine WLAN-/Web-Schicht gelinkt, Abbild und Partitionen pruefen
        run: >-
          python3 tools/check_standalone.py --build-dir .pio/build/LilyGo_TDeck_standalone
          --build-log .pio-LilyGo_TDeck_standalone.log
          --output .pio/build/LilyGo_TDeck_standalone/standalone-report
      - name: Bericht
        run: cat .pio/build/LilyGo_TDeck_standalone/standalone-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Echte Touch-Layout-Vorschauen (Demodaten, keine Hardwareaufnahme)
        run: |
          pip install pillow==11.3.0
          python3 tools/standalone_preview.py .pio/build/LilyGo_TDeck_standalone/touch-preview
      - name: Verifiziertes Testpaket fuer die 0.9.5-Abnahme vorbereiten
        shell: bash
        run: |
          BOOTAPP0=$(find "$HOME/.platformio/packages/" -path '*framework-arduinoespressif32*' -name boot_app0.bin | head -1)
          python3 tools/prepare_standalone_candidate.py --build-dir .pio/build/LilyGo_TDeck_standalone \
            --build-log .pio-LilyGo_TDeck_standalone.log --boot-app0 "$BOOTAPP0" --out .pio/standalone-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: LilyGo_TDeck_standalone-0.9.5-abnahme
          path: .pio/standalone-candidate/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LilyGo_TDeck_standalone-test
          path: |
            .pio/build/LilyGo_TDeck_standalone/firmware.bin
            .pio/build/LilyGo_TDeck_standalone/bootloader.bin
            .pio/build/LilyGo_TDeck_standalone/partitions.bin
            .pio/build/LilyGo_TDeck_standalone/standalone-report.json
            .pio/build/LilyGo_TDeck_standalone/standalone-report.md
            .pio/build/LilyGo_TDeck_standalone/touch-preview/*.png
            .pio-LilyGo_TDeck_standalone.log
